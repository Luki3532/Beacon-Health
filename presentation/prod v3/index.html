<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credential Tracking - Beacon Health System</title>
<link rel="stylesheet" href="assets/fluid.css">
<link rel="stylesheet" href="assets/classic.css">
</head>
<body>

<!-- ============ Fluid banner: persists across every page ============ -->
<header class="ps-banner">
  <button class="ps-banner-btn" id="btnBack" title="Back" aria-label="Back">
    <span class="ps-ico-back"></span>
  </button>

  <div class="ps-banner-title">
    <span class="ps-banner-org">Beacon Health System</span>
    <span class="ps-banner-page" id="bannerPage">Employee Self Service</span>
  </div>

  <div class="ps-banner-spacer"></div>

  <div class="ps-env" title="Database: HR92DMO">HR92DMO</div>

  <button class="ps-banner-btn" title="Home" aria-label="Home" id="btnHome">
    <span class="ps-ico-home"></span>
  </button>
  <button class="ps-banner-btn" title="Search" aria-label="Search">
    <span class="ps-ico-search"></span>
  </button>
  <button class="ps-banner-btn" title="Notifications" aria-label="Notifications">
    <span class="ps-ico-bell"></span>
    <span class="ps-ico-badge" id="bannerBadge">0</span>
  </button>
  <button class="ps-banner-btn" title="Actions" aria-label="Actions">
    <span class="ps-ico-dots"></span>
  </button>
  <button class="ps-banner-btn" title="NavBar" aria-label="NavBar">
    <span class="ps-ico-navbar"></span>
  </button>
</header>

<!-- ============ Classic breadcrumb: hidden on the Fluid homepage ============ -->
<nav class="ps-crumbs" id="crumbs" hidden></nav>

<!-- ============ Content pane ============ -->
<main id="content"></main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
